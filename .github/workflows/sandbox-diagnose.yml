name: Diagnose query sandbox
on:
  push:
    branches: [ci/diagnose-query-sandbox]
permissions:
  contents: read
jobs:
  matrix:
    name: Sandbox ${{ matrix.image }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
        node: ["22", repository]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.node == '22'
        with:
          node-version: "22"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.node == 'repository'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Environment
        run: |
          node --version
          bun --version
          uname -r
          ldd --version
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y strace
      - name: Integration tests
        id: tests
        continue-on-error: true
        working-directory: packages/engine-server
        run: bun run test src/query-sandbox.integration.test.ts
      - name: Trace startup failure with synthetic queries
        if: steps.tests.outcome == 'failure'
        working-directory: packages/engine-server
        run: |
          set +e
          strace -f -s 256 -e trace=all -o /tmp/sandbox.strace bun run test src/query-sandbox.integration.test.ts -t 'runs joins and aggregates'
          status=$?
          echo "traced test exit=$status"
          tail -n 160 /tmp/sandbox.strace
          grep -E 'EPERM|EACCES|SIGSYS|SIGABRT|exit_group\(70\)|query-sandbox:' /tmp/sandbox.strace | tail -n 120 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.tests.outcome == 'failure'
        with:
          name: trace-${{ matrix.image }}-${{ matrix.node }}
          path: /tmp/sandbox.strace
      - name: Preserve test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
  production:
    name: Production image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build actual production image
        run: docker build -t sandbox-production .
      - name: Prepare synthetic smoke and tracing image
        run: |
          mkdir -p /tmp/sandbox-diagnose
          cat > /tmp/sandbox-diagnose/smoke.ts <<'TS'
          import { WorkspaceQueryEngine, linuxQuerySandboxReadPaths } from "/app/packages/engine-server/src/query-sandbox.ts";
          import { tableFromIPC } from "/app/packages/engine-server/node_modules/apache-arrow";
          const runtime = "/usr/local/bin/node";
          const directory = "/opt/dashframe-query";
          const engine = new WorkspaceQueryEngine("synthetic-diagnostic", {
            launcher: `${directory}/query-launcher`, runtime,
            worker: `${directory}/worker.cjs`,
            uid: 65534, gid: 65534,
            addressSpaceBytes: 2 * 1024 * 1024 * 1024,
            cpuSeconds: 30, uidTaskLimit: 4096,
            readPaths: await linuxQuerySandboxReadPaths(runtime, directory),
          });
          try {
            await engine.initialize();
            const rows = tableFromIPC(await engine.queryArrow("SELECT 42 AS answer")).toArray().map(row => row.toJSON());
            if (rows.length !== 1 || rows[0].answer !== 42) throw new Error("Unexpected synthetic query result");
            console.log("SMOKE_PASS", rows);
          } finally { await engine.dispose(); }
          TS
          printf 'FROM sandbox-production\nRUN apt-get update && apt-get install -y --no-install-recommends strace\n' > /tmp/sandbox-diagnose/Dockerfile
          docker build -t sandbox-trace /tmp/sandbox-diagnose
      - name: Smoke production image with both Docker profiles
        run: |
          failed=0
          for profile in default unconfined; do
            options=()
            if [ "$profile" = unconfined ]; then options+=(--security-opt seccomp=unconfined); fi
            echo "=== PRODUCTION profile=$profile ==="
            docker run --rm "${options[@]}" sandbox-production sh -c 'node --version; bun --version; uname -r; ldd --version; cat /etc/os-release'
            if docker run --rm "${options[@]}" -v /tmp/sandbox-diagnose:/diagnostic:ro sandbox-production bun /diagnostic/smoke.ts; then
              echo "RESULT $profile PASS"
            else
              failed=1
              echo "RESULT $profile FAIL; collecting trace from diagnostic derivative"
              docker run --rm --cap-add SYS_PTRACE "${options[@]}" -v /tmp/sandbox-diagnose:/diagnostic sandbox-trace sh -c "strace -f -s 256 -e trace=all -o /diagnostic/$profile.strace bun /diagnostic/smoke.ts" || true
              tail -n 160 "/tmp/sandbox-diagnose/$profile.strace"
              grep -E 'EPERM|EACCES|SIGSYS|SIGABRT|exit_group\(70\)|query-sandbox:' "/tmp/sandbox-diagnose/$profile.strace" | tail -n 120 || true
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: production-traces
          path: /tmp/sandbox-diagnose/*.strace
