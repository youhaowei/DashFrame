name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request: stacked PRs target a feature branch as
  # their base (e.g. a PR based on another PR's branch), and a [main] filter
  # silently skipped CI for them — making the "CI green" merge gate vacuous
  # on stacks. CI must run for PRs targeting any base branch.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is deliberately its own job, not a step in `check`. As a step it
  # ran first and short-circuited the rest: a one-file prettier diff skipped
  # lint, typecheck and unit tests, and skipped the `e2e` job gated on this one
  # (PR #272, run 31006228705). Both are required for merge, and a formatting
  # failure can no longer hide a lint, typecheck, test or E2E result.
  #
  # `e2e` still declares `needs: check`, so a lint, typecheck or test failure
  # does still skip E2E. That gate is kept on purpose — E2E builds the wystack
  # submodule and installs Playwright browsers, and paying that on a revision
  # that cannot compile is waste. What blocks the merge in that case is the
  # failing `Lint, Type Check & Format` context, NOT the skipped `E2E Tests`
  # one: a job skipped because `needs` failed still posts a check run, and a
  # required check run whose conclusion is `skipped` does not hold up a
  # ruleset. So E2E is protection only on revisions that got far enough to run
  # it, and the cost of this gate is a second round trip when lint/typecheck
  # and E2E are broken at once.
  #
  # The `check` job's `name:` still reads "& Format" even though format moved
  # out. Renaming is deferred, not impossible: branch-ruleset required contexts
  # match display names as exact strings, so a rename means appending the new
  # context, cutting the job's `name:` over, then dropping the stale string —
  # worth doing only once the new `Format` context has reported green.
  # Until then the stale name is a trap: the `Format` context is NOT redundant
  # with it, and dropping `Format` from branch protection because this job's
  # name mentions format would stop prettier gating merges entirely.
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # No job here runs an authenticated git operation after checkout, so
          # leaving GITHUB_TOKEN in .git/config only widens what a compromised
          # step could reach.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: |
          bun format:check || (bun format && git diff && exit 1)

  check:
    name: Lint, Type Check & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun check` already runs check:ticket-refs as its first link; a separate
      # earlier step only added another way for a cheap guard to mask lint,
      # typecheck and test results.
      - name: Run checks
        run: bun check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Skip if e2e/web absent
        id: guard
        run: |
          if [ -d e2e/web ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "e2e/web not present yet — no tests to run"
          fi

      - name: Setup Bun
        if: steps.guard.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        run: bun install --frozen-lockfile

      # The web E2E target runs a production `vite build`, which resolves
      # @wystack/* via their `import`/`default` conditions → `dist/*.js`. Those
      # dist files only exist after the submodule is built. (Typecheck/lint jobs
      # consume wystack *source* via the `bun` condition, so they don't need
      # this — but the bundler build does.)
      - name: Build WyStack submodule
        if: steps.guard.outputs.present == 'true'
        run: bun run build:wystack

      - name: Install Playwright browsers
        if: steps.guard.outputs.present == 'true'
        run: cd e2e/web && bun playwright install --with-deps chromium chromium-headless-shell

      - name: Run E2E tests
        if: steps.guard.outputs.present == 'true'
        run: cd e2e/web && bun run test:e2e:ci

      - name: Upload test results
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/web/test-results/
          retention-days: 7
