name: Production query sandbox

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/build-query-sandbox.ts
      - scripts/start-railway.sh
      - packages/engine-server/**
      - packages/engine/**
      - packages/types/**
      - .node-version
      - package.json
      - bun.lock
      - bunfig.toml
      - .gitmodules
      - libs/stdui
      - libs/wystack
      - .github/workflows/query-sandbox-image.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Production image sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build production image
        run: docker build -t dashframe-sandbox-image .

      - name: Check the shipped query worker
        # Use the production launcher and bundle, with Docker's default seccomp
        # profile. All queries and results here are synthetic.
        run: |
          smoke_directory="$(mktemp -d)"
          trap 'rm -rf "$smoke_directory"' EXIT
          cat > "$smoke_directory/smoke.ts" <<'TS'
          import { WorkspaceQueryEngine, linuxQuerySandboxReadPaths } from "/app/packages/engine-server/src/query-sandbox.ts";
          import { tableFromIPC } from "/app/packages/engine-server/node_modules/apache-arrow";

          const runtime = "/usr/local/bin/node";
          const directory = "/opt/dashframe-query";
          const engine = new WorkspaceQueryEngine("image-smoke", {
            launcher: `${directory}/query-launcher`,
            runtime,
            worker: `${directory}/worker.cjs`,
            uid: 10001,
            gid: 10001,
            addressSpaceBytes: 2 * 1024 * 1024 * 1024,
            cpuSeconds: 30,
            uidTaskLimit: 4096,
            readPaths: await linuxQuerySandboxReadPaths(runtime, directory),
          });
          try {
            await engine.initialize();
            const rows = tableFromIPC(await engine.queryArrow("SELECT 42 AS answer"))
              .toArray().map(row => row.toJSON());
            if (rows.length !== 1 || rows[0].answer !== 42)
              throw new Error("Unexpected sandbox query result");
            console.log("Production query sandbox passed", rows);
          } finally {
            await engine.dispose();
          }
          TS
          docker run --rm --volume "$smoke_directory:/smoke:ro" dashframe-sandbox-image \
            sh -c 'node --version && bun --version && uname -r && ldd --version && bun /smoke/smoke.ts'
