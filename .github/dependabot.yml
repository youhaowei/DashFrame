version: 2
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are one action released together; a PR that bumps only
      # one of them fails CodeQL on the version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
